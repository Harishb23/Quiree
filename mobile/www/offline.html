<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiree — offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #F8F5FF; color: #30243D; text-align: center; padding: 24px; }
    h1 { color: #452269; font-size: 22px; margin: 0 0 8px; }
    p { color: #71677D; margin: 0 0 20px; }
    button { background: #6B3FA0; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Connect to the internet to open Quiree. Your QR widget on the home screen keeps working offline.</p>
    <button onclick="location.href='https://quiree.runasp.net'">Try again</button>
  </div>
</body>
</html>
